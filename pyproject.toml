[project]
name = "ai-movement-coach"
version = "0.1.0"
description = "Real-time webcam feedback for physical therapy exercises (pilot)"
requires-python = ">=3.10"
dependencies = ["mediapipe>=0.10", "opencv-python", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
coach = "coach.run:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
